name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace 2>&1 | tee build.log

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk PRoud.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PRoud-apk
          path: PRoud.apk

      - name: Move 'latest' tag
        if: github.ref == 'refs/heads/main'
        run: |
          git tag -f latest
          git push -f origin latest

      - name: Publish to 'latest' release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: PRoud (legfrissebb)
          prerelease: true
          files: PRoud.apk

      - name: Publish build errors
        if: failure() && github.ref == 'refs/heads/main'
        run: |
          grep -E "^e: |error:|What went wrong|FAILED" -A4 build.log | head -300 > /tmp/errors.txt || true
          if [ ! -s /tmp/errors.txt ]; then tail -80 build.log > /tmp/errors.txt; fi
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git checkout --orphan build-log
          git rm -rf . -q
          echo "sha: $GITHUB_SHA" > errors.txt
          cat /tmp/errors.txt >> errors.txt
          git add errors.txt
          git commit -q -m "build errors"
          git push -f origin build-log
